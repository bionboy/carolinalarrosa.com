<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>carolina larrosa</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <meta name="description" content="">
    <style>
      @font-face {
        font-family: "Archivo Black";
        font-style: normal;
        font-weight: 400;
        src: url("assets/fonts/archivo-black.ttf") format("truetype");
        font-display: swap;
      }

      @font-face {
        font-family: "Space Grotesk";
        font-style: normal;
        font-weight: 600;
        src: url("assets/fonts/space-grotesk-600.ttf") format("truetype");
        font-display: swap;
      }

      @font-face {
        font-family: "Space Grotesk";
        font-style: normal;
        font-weight: 700;
        src: url("assets/fonts/space-grotesk-700.ttf") format("truetype");
        font-display: swap;
      }

      :root {
        --background: #fff;
        --text: #000;
        --red: #ef422a;
        --site-gutter: 4vw;
        --mobile-gutter: 6vw;
        --max-width: 1500px;
        --gap: 11px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: var(--background);
        color: var(--text);
        font-family: "Space Grotesk", Arial, sans-serif;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0;
      }

      body {
        min-height: 100%;
        margin: 0;
        background: var(--background);
      }

      img {
        display: block;
        max-width: 100%;
      }

      a {
        color: inherit;
      }

      .page {
        overflow-x: hidden;
      }

      .section {
        width: 100%;
        padding: 0;
      }

      .section--hero {
        height: calc(100vh + 145px);
        padding-top: 226px;
      }

      .section--contact {
        padding-top: 0;
      }

      .hero-inner {
        position: relative;
        width: 88vw;
        height: 430px;
        margin: 0 auto;
      }

      .name-mark img {
        width: 100%;
        height: auto;
      }

      .tagline {
        position: absolute;
        left: 0;
        top: 56px;
        width: 100%;
        margin: 0;
        font-family: "Space Grotesk", Arial, sans-serif;
        font-size: 23px;
        font-weight: 700;
        line-height: 1.15;
        text-align: left;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .headshot {
        position: absolute;
        left: calc(50% - 66px);
        top: 122px;
        width: 132px;
      }

      .portfolio-wrap {
        position: absolute;
        left: 50%;
        top: 332px;
        transform: translateX(-50%);
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 0;
        padding: 0 48px;
        border: 0;
        border-radius: 999px;
        background: var(--red);
        color: var(--background);
        font-family: "Space Grotesk", Arial, sans-serif;
        font-size: 16px;
        font-weight: 600;
        line-height: 1;
        text-decoration: none;
        transition: background-color 0.1s ease, color 0.1s ease, opacity 0.1s ease;
      }

      .portfolio-wrap .button {
        width: 65.4vw;
        height: 59px;
        text-transform: uppercase;
      }

      .button:hover,
      .button:focus-visible {
        opacity: 0.82;
      }

      .button:active {
        opacity: 0.72;
      }

      .contact-inner {
        width: 38.7vw;
        margin: 0 auto;
      }

      .contact-title {
        margin: 0;
        font-family: "Space Grotesk", Arial, sans-serif;
        font-size: 22.912px;
        font-weight: 600;
        line-height: 1.5;
      }

      .contact-form {
        width: 100%;
        margin-top: 30px;
      }

      .field {
        margin: 0 0 20px;
      }

      .field label {
        display: block;
        margin: 0 0 4px;
        font-size: 16px;
        font-weight: 600;
        line-height: 24px;
      }

      .required {
        margin-left: 0.25em;
      }

      .name-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .sub-label {
        display: block;
        margin: 0 0 4px;
        font-size: 12px;
        font-weight: 600;
        line-height: 24px;
      }

      input,
      textarea {
        width: 100%;
        border: 1px solid #a9a9a9;
        border-radius: 0;
        background: #fafafa;
        color: #000;
        font: 600 16px/1.4 "Space Grotesk", Arial, sans-serif;
        outline: none;
      }

      input {
        height: 46px;
        padding: 9px 10px;
      }

      textarea {
        min-height: 100px;
        padding: 9px 10px;
        resize: vertical;
      }

      input:hover,
      textarea:hover,
      input:focus,
      textarea:focus {
        border-color: #a9a9a9;
        box-shadow: none;
      }

      .submit {
        width: 161px;
        height: 91px;
        margin-top: 1px;
        border: 3px solid #fff;
        cursor: pointer;
        text-transform: uppercase;
      }

      .submit-message {
        display: none;
        margin-top: 16px;
        font-size: 16px;
      }

      .contact-form.submitted .submit-message,
      [data-fs-success]:not(:empty) {
        display: block;
      }

      [data-fs-error]:not(:empty) {
        display: block;
        margin-top: 8px;
        color: #c32d38;
        font-size: 14px;
      }

      [data-fs-submit-btn][disabled] {
        opacity: 0.6;
        cursor: wait;
      }

      @media (min-width: 768px) {
        .section--hero {
          height: calc(100vh + 127px);
        }

        .section--hero {
          padding-top: calc(50vh - 50px - 10.9vw);
        }

        .hero-inner {
          width: 54.5vw;
        }

        .tagline {
          top: clamp(46px, 5vw, 79px);
          font-size: 25px;
        }

        .headshot {
          left: 72.9%;
          top: clamp(91px, 7.6vw, 122px);
          width: 14.5vw;
          max-width: 222px;
        }

        .portfolio-wrap {
          left: 0;
          top: clamp(108px, calc(8vw + 40px), 166px);
          transform: none;
        }

        .portfolio-wrap .button {
          width: clamp(186px, 22.9vw, 368px);
          height: clamp(42px, 4.8vw, 76px);
        }

        .name-field label {
          margin-bottom: 8px;
        }
      }

      @media (min-width: 768px) and (max-width: 999px) {
        .contact-form {
          margin-top: 7px;
        }

        .tagline {
          font-size: 23px;
          line-height: 1.18;
        }

        .contact-title {
          font-size: 19.6864px;
          line-height: 1.5;
        }
      }

      @media (min-width: 768px) and (max-width: 820px) {
        .tagline {
          width: 360px;
        }
      }

      @media (min-width: 1000px) and (max-width: 1299px) {
        .contact-form {
          margin-top: calc(9px + ((100vw - 1000px) * 0.05));
        }
      }

      @media (min-width: 1300px) {
        .section--hero {
          height: calc(100vh + 145px);
        }
      }

      @media (min-width: 1500px) {
        .section--hero {
          height: calc(100vh + 145px + ((100vw - 1440px) * 0.075));
        }

        .contact-form {
          margin-top: 40px;
        }
      }

      @media (max-width: 767px) {
        .contact-inner {
          width: 88vw;
        }

        .contact-title {
          font-size: 20.32px;
          line-height: 1.5;
        }

        .name-row {
          grid-template-columns: 1fr 1fr;
          gap: 10px;
        }
      }

      @media (max-width: 340px) {
        .section--hero {
          padding-top: 218px;
        }

        .tagline {
          top: 50px;
          width: 220px;
          font-size: 25px;
          line-height: 1.05;
        }

        .headshot {
          top: 140px;
        }

        .portfolio-wrap {
          top: 350px;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="section section--hero" aria-label="Carolina Larrosa">
        <div class="hero-inner">
          <div class="name-mark">
            <img src="assets/images/name.webp" alt="carolina larrosa">
          </div>
          <h1 class="tagline">Interactive Experience Designer</h1>
          <div class="headshot">
            <img src="assets/images/polaroid-headshot.webp" alt="">
          </div>
          <div class="portfolio-wrap">
            <a class="button" href="s/CarolinaLarrosa_Portfolio_260211_WEB3.pdf" target="_blank" rel="noopener">Portfolio</a>
          </div>
        </div>
      </section>

      <section class="section section--contact" aria-label="Contact">
        <div class="contact-inner">
          <h2 class="contact-title">Let’s get in touch!</h2>
          <div data-fs-success></div>
          <div data-fs-error></div>

          <form class="contact-form" id="contact">
            <div class="field name-field">
              <label>Name</label>
              <div class="name-row">
                <span>
                  <span class="sub-label">First Name</span>
                  <input type="text" name="first-name" autocomplete="given-name" data-fs-field>
                </span>
                <span>
                  <span class="sub-label">Last Name</span>
                  <input type="text" name="last-name" autocomplete="family-name" data-fs-field>
                </span>
              </div>
            </div>
            <div class="field">
              <label for="email">Email<span class="required">(required)</span></label>
              <input id="email" type="email" name="email" autocomplete="email" required data-fs-field>
              <span data-fs-error="email"></span>
            </div>
            <div class="field">
              <label for="subject">Subject<span class="required">(required)</span></label>
              <input id="subject" type="text" name="subject" required data-fs-field>
              <span data-fs-error="subject"></span>
            </div>
            <div class="field">
              <label for="message">Message<span class="required">(required)</span></label>
              <textarea id="message" name="message" required data-fs-field></textarea>
              <span data-fs-error="message"></span>
            </div>
            <button class="button submit" type="submit" data-fs-submit-btn>Submit</button>
            <p class="submit-message">Thank you!</p>
          </form>
        </div>
      </section>
    </main>
    <script>
      window.formspree = window.formspree || function () { (formspree.q = formspree.q || []).push(arguments); };
      formspree('initForm', { formElement: '#contact', formId: 'meewkydr' });
    </script>
    <script src="https://unpkg.com/@formspree/ajax@1" defer></script>
  </body>
</html>
